<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Montage Agent</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f4f4f5;
            color: #1a1a1a;
            min-height: 100vh;
            /* 半调点阵背景 */
            background-image: radial-gradient(circle, #ddd 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .container { max-width: 860px; margin: 0 auto; padding: 30px 16px; }

        /* ===== 漫画风标题 ===== */
        .header {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
            padding: 28px 20px 20px;
            background: #fff;
            border: 3px solid #000;
            box-shadow: 6px 6px 0 #000;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -30px; right: -30px;
            width: 120px; height: 120px;
            background: #FB7299;
            border-radius: 50%;
            opacity: 0.12;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -20px; left: -20px;
            width: 80px; height: 80px;
            background: #00a1d6;
            border-radius: 50%;
            opacity: 0.1;
        }
        .header h1 {
            font-size: 2.2em;
            font-weight: 900;
            color: #FB7299;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0 #000;
            position: relative;
        }
        .header .subtitle {
            font-size: 0.95em;
            color: #666;
            margin-top: 6px;
            font-weight: 400;
        }

        /* ===== 漫画卡片 ===== */
        .card {
            background: #fff;
            border: 3px solid #000;
            box-shadow: 5px 5px 0 #000;
            padding: 24px;
            margin-bottom: 20px;
            position: relative;
            transition: transform 0.15s;
        }
        .card:hover { transform: translate(-1px, -1px); }
        .card h2 {
            font-size: 1.15em;
            font-weight: 900;
            margin-bottom: 16px;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card h2 .num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px; height: 28px;
            background: #FB7299;
            color: #fff;
            font-size: 0.85em;
            font-weight: 900;
            border: 2px solid #000;
            flex-shrink: 0;
        }

        /* ===== Tab 切换（B站 pill 风格） ===== */
        .tab-group { display: flex; gap: 0; margin-bottom: 16px; }
        .tab {
            padding: 10px 24px;
            background: #f4f4f5;
            border: 2px solid #000;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 700;
            color: #666;
            transition: all 0.15s;
            position: relative;
        }
        .tab:first-child { border-radius: 6px 0 0 6px; }
        .tab:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
        .tab.active {
            background: #FB7299;
            color: #fff;
            border-color: #000;
            z-index: 1;
        }
        .tab:hover:not(.active) { background: #ffe4ec; }

        .hidden { display: none; }

        /* ===== 表单元素 ===== */
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.88em;
            font-weight: 700;
            color: #333;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px 14px;
            background: #fff;
            border: 2px solid #000;
            border-radius: 4px;
            color: #1a1a1a;
            font-size: 0.95em;
            font-family: inherit;
            transition: box-shadow 0.15s;
        }
        input:focus {
            outline: none;
            box-shadow: 3px 3px 0 #FB7299;
            border-color: #FB7299;
        }

        /* ===== 文件上传（漫画虚线框） ===== */
        .file-upload { display: flex; align-items: center; gap: 12px; }
        .file-upload input[type="file"] { display: none; }
        .file-upload label {
            padding: 12px 20px;
            background: #fff;
            border: 3px dashed #000;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            flex: 1;
            font-weight: 700;
            font-size: 0.9em;
            transition: all 0.15s;
        }
        .file-upload label:hover {
            border-color: #FB7299;
            background: #ffe4ec;
        }
        .file-upload .file-name {
            font-size: 0.85em;
            color: #999;
            min-width: 100px;
            font-weight: 400;
        }

        /* ===== 素材来源表格 ===== */
        .source-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #f4f4f5;
            border: 2px solid #000;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95em;
            margin-bottom: 0;
            transition: all 0.15s;
            user-select: none;
        }
        .source-toggle:hover { background: #ffe4ec; }
        .source-toggle .arrow {
            transition: transform 0.2s;
            font-size: 0.8em;
        }
        .source-toggle.open .arrow { transform: rotate(180deg); }
        .source-toggle.open { border-bottom-color: #FB7299; }

        .source-table-wrap {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            border: 2px solid #000;
            border-top: 0;
            border-radius: 0 0 4px 4px;
        }
        .source-table-wrap.open { max-height: 600px; }

        .source-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88em;
        }
        .source-table th {
            background: #1a1a1a;
            color: #fff;
            padding: 8px 12px;
            text-align: left;
            font-weight: 700;
            font-size: 0.85em;
        }
        .source-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: middle;
        }
        .source-table tr:last-child td { border-bottom: none; }
        .source-table tr:hover td { background: #ffe4ec; }
        .source-table tr.disabled td { opacity: 0.45; }
        .source-table tbody tr { cursor: pointer; }

        .source-table input[type="checkbox"] {
            width: 18px; height: 18px;
            accent-color: #FB7299;
            cursor: pointer;
        }
        .source-table .source-name { font-weight: 700; }

        /* 状态标签 */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.78em;
            font-weight: 700;
            border: 1.5px solid #000;
        }
        .badge-recommend { background: #FB7299; color: #fff; }
        .badge-ok { background: #4CAF50; color: #fff; }
        .badge-limited { background: #FF9800; color: #fff; }
        .badge-unavailable { background: #ccc; color: #666; }

        /* 类型标签 */
        .type-tag {
            display: inline-block;
            padding: 1px 6px;
            background: #00a1d6;
            color: #fff;
            border-radius: 3px;
            font-size: 0.78em;
            font-weight: 700;
        }

        /* ===== 风格选择（漫画卡片） ===== */
        .style-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .style-option {
            padding: 14px 8px;
            background: #fff;
            border: 3px solid #000;
            box-shadow: 3px 3px 0 #000;
            cursor: pointer;
            text-align: center;
            font-size: 0.85em;
            font-weight: 700;
            transition: all 0.12s;
            position: relative;
            user-select: none;
        }
        .style-option:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #000; }
        .style-option.active {
            background: #FB7299;
            color: #fff;
            border-color: #000;
        }
        .style-option .style-icon { font-size: 1.6em; display: block; margin-bottom: 4px; }
        .style-option .style-name { display: block; line-height: 1.3; }
        .style-option .style-tag {
            display: block;
            font-size: 0.75em;
            font-weight: 400;
            opacity: 0.7;
            margin-top: 2px;
        }

        /* ===== 提交按钮（漫画大按钮） ===== */
        .btn {
            padding: 14px 32px;
            border: 3px solid #000;
            font-size: 1.05em;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.12s;
            font-family: inherit;
            letter-spacing: 1px;
        }
        .btn-primary {
            background: #FB7299;
            color: #fff;
            width: 100%;
            box-shadow: 5px 5px 0 #000;
        }
        .btn-primary:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0 #000;
        }
        .btn-primary:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: 5px 5px 0 #000;
        }

        /* ===== 进度条 ===== */
        .progress-container { display: none; }
        .progress-container.active { display: block; }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #f4f4f5;
            border: 2px solid #000;
            border-radius: 0;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-bar-fill {
            height: 100%;
            background: #FB7299;
            transition: width 0.3s;
            width: 0%;
            /* 条纹动画 */
            background-image: linear-gradient(
                45deg,
                rgba(255,255,255,0.2) 25%, transparent 25%,
                transparent 50%, rgba(255,255,255,0.2) 50%,
                rgba(255,255,255,0.2) 75%, transparent 75%
            );
            background-size: 20px 20px;
            animation: stripe-move 0.8s linear infinite;
        }
        @keyframes stripe-move {
            0% { background-position: 0 0; }
            100% { background-position: 20px 0; }
        }
        .progress-status { text-align: center; font-size: 0.9em; font-weight: 700; color: #333; }

        /* ===== 进度步骤指示器 ===== */
        .progress-steps {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 14px 0 8px;
            flex-wrap: wrap;
        }
        .step-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border: 2px solid #ccc;
            border-radius: 4px;
            font-size: 0.78em;
            font-weight: 700;
            color: #999;
            background: #f4f4f5;
            transition: all 0.3s;
        }
        .step-item.active {
            border-color: #FB7299;
            color: #FB7299;
            background: #ffe4ec;
        }
        .step-item.done {
            border-color: #4CAF50;
            color: #4CAF50;
            background: #e8f5e9;
        }
        .step-item .step-icon { font-size: 1em; }

        /* 已用时间 */
        .progress-elapsed {
            text-align: center;
            font-size: 0.8em;
            color: #999;
            margin-top: 4px;
        }

        /* ===== 结果 ===== */
        .result { display: none; text-align: center; padding: 20px; }
        .result.active { display: block; }
        .result a {
            color: #FB7299;
            text-decoration: none;
            font-size: 1.15em;
            font-weight: 900;
            border-bottom: 3px solid #FB7299;
            padding-bottom: 2px;
        }
        .result a:hover { color: #e0507a; border-color: #e0507a; }

        /* ===== 漫画装饰 ===== */
        .manga-burst {
            position: absolute;
            top: -6px; right: -6px;
            background: #FB7299;
            color: #fff;
            font-size: 0.7em;
            font-weight: 900;
            padding: 3px 8px;
            border: 2px solid #000;
            transform: rotate(6deg);
            z-index: 2;
        }

        /* ===== 震动提示动画 ===== */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 50%, 90% { transform: translateX(-4px); }
            30%, 70% { transform: translateX(4px); }
        }
        .shake {
            animation: shake 0.4s ease;
            border-color: #FB7299 !important;
            box-shadow: 0 0 0 2px rgba(251, 114, 153, 0.3) !important;
        }

        /* 漫画风提示气泡 */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: #FB7299;
            color: #fff;
            font-weight: 900;
            font-size: 0.95em;
            padding: 10px 24px;
            border: 3px solid #000;
            box-shadow: 4px 4px 0 #000;
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1>AI MONTAGE AGENT</h1>
            <p class="subtitle">输入关键词或上传视频，AI 自动混剪</p>
        </div>

        <!-- 1. 素材来源 -->
        <div class="card">
            <h2><span class="num">1</span> 素材来源</h2>

            <div class="tab-group">
                <div class="tab active" onclick="switchSource('search', this)">关键词搜索</div>
                <div class="tab" onclick="switchSource('upload', this)">本地上传</div>
            </div>

            <!-- 本地上传 -->
            <div id="upload-section" class="hidden">
                <div class="form-group">
                    <div class="file-upload">
                        <label for="video-files">选择视频文件（可多选）</label>
                        <input type="file" id="video-files" accept="video/*" multiple onchange="updateFileNames(this, 'video-names')">
                        <span class="file-name" id="video-names">未选择文件</span>
                    </div>
                </div>
            </div>

            <!-- 关键词搜索 -->
            <div id="search-section">
                <div class="form-group">
                    <label>搜索关键词</label>
                    <input type="text" id="search-query" placeholder="如：i love you / fight scene / 漫威混剪">
                </div>
                <div class="form-group">
                    <label>最大下载数</label>
                    <input type="number" id="clip-limit" value="20" min="1" max="100">
                </div>

                <!-- 素材来源表格 -->
                <div class="form-group">
                    <label>素材来源</label>
                    <div class="source-toggle" onclick="toggleSourceTable()">
                        <span>已选择 <strong id="selected-count">1</strong> 个来源</span>
                        <span class="arrow">&#9660;</span>
                    </div>
                    <div class="source-table-wrap" id="source-table-wrap">
                        <table class="source-table">
                            <thead>
                                <tr>
                                    <th style="width:36px"></th>
                                    <th>来源</th>
                                    <th>类型</th>
                                    <th>说明</th>
                                    <th style="width:72px">状态</th>
                                </tr>
                            </thead>
                            <tbody id="source-tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. BGM -->
        <div class="card">
            <h2><span class="num">2</span> 背景音乐</h2>
            <div class="tab-group">
                <div class="tab active" onclick="switchBgm('search', this)">搜索 BGM</div>
                <div class="tab" onclick="switchBgm('upload', this)">本地上传</div>
            </div>
            <div id="bgm-search-section">
                <div class="form-group">
                    <label>搜索关键词</label>
                    <input type="text" id="bgm-query" placeholder="如：epic cinematic / 古风纯音乐 / 漫威 BGM">
                </div>
            </div>
            <div id="bgm-upload-section" class="hidden">
                <div class="file-upload">
                    <label for="bgm-file">选择 BGM 文件</label>
                    <input type="file" id="bgm-file" accept="audio/*" onchange="updateFileNames(this, 'bgm-name')">
                    <span class="file-name" id="bgm-name">未选择文件</span>
                </div>
            </div>
        </div>

        <!-- 3. 风格 -->
        <div class="card" style="position:relative">
            <h2><span class="num">3</span> 风格模板</h2>
            <div class="style-grid" id="style-grid">
                <!-- JS 动态渲染 -->
            </div>
            <p id="style-desc" style="font-size:0.85em; color:#666; margin-top:12px; min-height:1.2em; text-align:center;"></p>
            <input type="hidden" id="style-value" value="dynamic">
            <input type="hidden" id="style-preset-value" value="">
        </div>

        <!-- 提交 -->
        <button class="btn btn-primary" id="submit-btn" onclick="submitTask()">开始混剪</button>

        <!-- 进度 -->
        <div class="card progress-container" id="progress-section">
            <h2><span class="num">!</span> 混剪进度</h2>
            <div class="progress-steps" id="progress-steps">
                <div class="step-item" id="step-bgm"><span class="step-icon">🎵</span> BGM</div>
                <div class="step-item" id="step-search"><span class="step-icon">🔍</span> 搜索素材</div>
                <div class="step-item" id="step-analyze"><span class="step-icon">🧠</span> 分析</div>
                <div class="step-item" id="step-render"><span class="step-icon">🎬</span> 渲染</div>
                <div class="step-item" id="step-post"><span class="step-icon">✨</span> 后处理</div>
            </div>
            <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
            <p class="progress-status" id="progress-msg">准备中...</p>
            <p class="progress-elapsed" id="progress-elapsed"></p>
        </div>

        <!-- 结果 -->
        <div class="card result" id="result-section">
            <h2>混剪完成!</h2>
            <p style="margin: 16px 0;"><a id="download-link" href="#">下载视频</a></p>
        </div>
    </div>

    <script>
        // ===== 素材来源数据 =====
        const sources = [
            { value: "playphrase", name: "PlayPhrase", type: "电影原片", desc: "3900万+英文台词片段，无水印", status: "recommend", checked: true },
            { value: "quodb", name: "QuoDB", type: "台词库", desc: "精确台词+电影+时间码", status: "ok", checked: false },
            { value: "bilibili", name: "B站", type: "二创", desc: "B站视频，可能有作者水印", status: "ok", checked: false },
            { value: "youtube", name: "YouTube", type: "全品类", desc: "需要代理+登录cookies", status: "limited", checked: false },
            { value: "dailymotion", name: "Dailymotion", type: "全品类", desc: "国际视频平台", status: "limited", checked: false },
            { value: "douyin", name: "抖音", type: "短视频", desc: "不支持搜索，需直接URL", status: "unavailable", checked: false },
            { value: "ixigua", name: "西瓜视频", type: "影视综艺", desc: "不支持搜索，需直接URL", status: "unavailable", checked: false },
            { value: "acfun", name: "AcFun", type: "动漫二创", desc: "不支持搜索，需直接URL", status: "unavailable", checked: false },
            { value: "vimeo", name: "Vimeo", type: "创意短片", desc: "不支持搜索，需直接URL", status: "unavailable", checked: false },
            { value: "yarn", name: "YARN", type: "台词搜索", desc: "Cloudflare封锁", status: "unavailable", checked: false },
            { value: "zhaotaici", name: "找台词网", type: "中文台词", desc: "SSL错误，站点下线", status: "unavailable", checked: false },
        ];

        const badgeMap = {
            recommend: { text: "推荐", cls: "badge-recommend" },
            ok: { text: "可用", cls: "badge-ok" },
            limited: { text: "受限", cls: "badge-limited" },
            unavailable: { text: "不可用", cls: "badge-unavailable" },
        };

        // 渲染来源表格
        function renderSourceTable() {
            const tbody = document.getElementById("source-tbody");
            tbody.innerHTML = sources.map((s, i) => {
                const badge = badgeMap[s.status];
                const disabled = s.status === "unavailable" ? ' class="disabled"' : "";
                return `<tr${disabled} onclick="toggleSource(${i}, this)">
                    <td><input type="checkbox" data-index="${i}" ${s.checked ? "checked" : ""} ${s.status === "unavailable" ? "disabled" : ""} onclick="event.stopPropagation()"></td>
                    <td class="source-name">${s.name}</td>
                    <td><span class="type-tag">${s.type}</span></td>
                    <td>${s.desc}</td>
                    <td><span class="badge ${badge.cls}">${badge.text}</span></td>
                </tr>`;
            }).join("");
            updateSelectedCount();
        }

        function onSourceCheck() {
            const checks = document.querySelectorAll(".source-table input[type=checkbox]");
            checks.forEach((cb, i) => { sources[i].checked = cb.checked; });
            updateSelectedCount();
        }

        function toggleSource(index, row) {
            if (sources[index].status === "unavailable") return;
            sources[index].checked = !sources[index].checked;
            const cb = row.querySelector("input[type=checkbox]");
            cb.checked = sources[index].checked;
            updateSelectedCount();
        }

        function updateSelectedCount() {
            const count = sources.filter(s => s.checked).length;
            document.getElementById("selected-count").textContent = count;
        }

        function getSelectedSources() {
            return sources.filter(s => s.checked).map(s => s.value);
        }

        // 展开/收起来源表格
        function toggleSourceTable() {
            const toggle = document.querySelector(".source-toggle");
            const wrap = document.getElementById("source-table-wrap");
            toggle.classList.toggle("open");
            wrap.classList.toggle("open");
        }

        // ===== Tab 切换 =====
        let sourceMode = "search";
        let bgmMode = "search";

        function switchSource(mode, el) {
            sourceMode = mode;
            el.parentElement.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            el.classList.add("active");
            document.getElementById("upload-section").classList.toggle("hidden", mode !== "upload");
            document.getElementById("search-section").classList.toggle("hidden", mode !== "search");
        }

        function switchBgm(mode, el) {
            bgmMode = mode;
            el.parentElement.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            el.classList.add("active");
            document.getElementById("bgm-upload-section").classList.toggle("hidden", mode !== "upload");
            document.getElementById("bgm-search-section").classList.toggle("hidden", mode !== "search");
        }

        // ===== 震动提示 =====
        function shake(el) {
            if (!el) return;
            el.classList.remove("shake");
            void el.offsetWidth; // 触发 reflow 重启动画
            el.classList.add("shake");
            setTimeout(() => el.classList.remove("shake"), 500);
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("show");
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove("show"), 2200);
        }

        // ===== 文件上传 =====
        function updateFileNames(input, spanId) {
            const span = document.getElementById(spanId);
            if (input.files.length === 0) span.textContent = "未选择文件";
            else if (input.files.length === 1) span.textContent = input.files[0].name;
            else span.textContent = input.files.length + " 个文件";
        }

        // ===== 风格选择（卡片模式） =====
        let _stylePresets = [];

        // 每个模板的图标和中文名
        const _styleMeta = {
            action:      { icon: "💥", cn: "动作大片", tag: "快切·高能" },
            vlog:        { icon: "📷", cn: "Vlog 日常", tag: "稳定·明亮" },
            documentary: { icon: "🎞️", cn: "纪录片", tag: "沉稳·自然" },
            wedding:     { icon: "💍", cn: "婚礼浪漫", tag: "暖色·柔美" },
            gaming:      { icon: "🎮", cn: "游戏集锦", tag: "高对比·快节奏" },
            mtv:         { icon: "🎤", cn: "MTV 风格", tag: "节奏感·炫酷" },
            sport:       { icon: "⚽", cn: "体育高燃", tag: "高速·冲击" },
            travel:      { icon: "✈️", cn: "旅行日记", tag: "金色调·舒缓" },
            cinematic:   { icon: "🎬", cn: "电影感", tag: "史诗·质感" },
            viral:       { icon: "🔥", cn: "爆款短视频", tag: "鲜艳·抓眼球" },
            lofi:        { icon: "🌙", cn: "Lo-Fi 氛围", tag: "复古·慵懒" },
        };

        async function loadStylePresets() {
            try {
                const resp = await fetch("/api/styles");
                _stylePresets = await resp.json();
            } catch (e) {
                // 降级：用内置数据
                _stylePresets = [
                    { id: "action", name: "Action Blockbuster", description: "Explosive energy, rapid cuts" },
                    { id: "vlog", name: "Vlog Daily", description: "Stable, bright, everyday feel" },
                    { id: "documentary", name: "Documentary", description: "Calm, natural pacing" },
                    { id: "wedding", name: "Wedding Romantic", description: "Warm tones, soft transitions" },
                    { id: "gaming", name: "Gaming Highlights", description: "High contrast, fast rhythm" },
                    { id: "mtv", name: "MTV Style", description: "Rhythmic, flashy cuts" },
                    { id: "sport", name: "Sport Highlights", description: "High speed, impactful" },
                    { id: "travel", name: "Travel Diary", description: "Golden hour, relaxed" },
                    { id: "cinematic", name: "Cinematic Epic", description: "Epic pacing, filmic look" },
                    { id: "viral", name: "Viral Short", description: "Vibrant, eye-catching" },
                    { id: "lofi", name: "Lo-Fi Chill", description: "Dreamy, vintage vibes" },
                ];
            }
            renderStyleGrid();
        }

        function renderStyleGrid() {
            const grid = document.getElementById("style-grid");
            grid.innerHTML = _stylePresets.map(s => {
                const meta = _styleMeta[s.id] || { icon: "🎨", cn: s.name, tag: "" };
                return `<div class="style-option" data-id="${s.id}" onclick="selectStyle('${s.id}', this)">
                    <span class="style-icon">${meta.icon}</span>
                    <span class="style-name">${meta.cn}</span>
                    <span class="style-tag">${meta.tag}</span>
                </div>`;
            }).join("");
            // 默认选中 action
            const defaultEl = grid.querySelector('[data-id="action"]');
            if (defaultEl) selectStyle("action", defaultEl);
        }

        function selectStyle(presetId, el) {
            // 取消之前的选中
            document.querySelectorAll(".style-option").forEach(o => o.classList.remove("active"));
            el.classList.add("active");

            document.getElementById("style-preset-value").value = presetId;

            const preset = _stylePresets.find(s => s.id === presetId);
            const meta = _styleMeta[presetId] || {};
            document.getElementById("style-desc").textContent =
                preset ? `${meta.icon || ""} ${preset.description}` : "";

            // 映射到基础风格
            const styleMap = {
                action: "intense", gaming: "intense", mtv: "intense",
                sport: "intense", viral: "intense",
                vlog: "dynamic", cinematic: "dynamic",
                documentary: "calm", wedding: "calm", travel: "calm", lofi: "calm",
            };
            document.getElementById("style-value").value = styleMap[presetId] || "dynamic";
        }

        // ===== 上传 & 提交 =====
        async function uploadFiles(files) {
            const formData = new FormData();
            for (const f of files) formData.append("files", f);
            const resp = await fetch("/api/upload/video", { method: "POST", body: formData });
            const data = await resp.json();
            return data.files;
        }

        async function uploadBgm(file) {
            const formData = new FormData();
            formData.append("file", file);
            const resp = await fetch("/api/upload/bgm", { method: "POST", body: formData });
            const data = await resp.json();
            return data.path;
        }

        // ===== 进度步骤管理 =====
        let _elapsedTimer = null;
        let _elapsedStart = 0;
        let _currentEvtSource = null;

        function resetProgressSteps() {
            ["step-bgm", "step-search", "step-analyze", "step-render", "step-post"].forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove("active", "done");
            });
        }

        function setStepActive(stepId) {
            const el = document.getElementById(stepId);
            if (el) { el.classList.add("active"); el.classList.remove("done"); }
        }

        function setStepDone(stepId) {
            const el = document.getElementById(stepId);
            if (el) { el.classList.remove("active"); el.classList.add("done"); }
        }

        function updateStepsByProgress(progress, message) {
            const msg = message || "";
            // BGM 阶段: 0-8
            if (progress <= 8) {
                if (progress >= 8) { setStepDone("step-bgm"); } else { setStepActive("step-bgm"); }
                setStepActive("step-bgm");
            } else {
                setStepDone("step-bgm");
            }
            // 搜索素材阶段: 10-25
            if (progress > 8 && progress <= 25) {
                setStepActive("step-search");
            } else if (progress > 25) {
                setStepDone("step-search");
            }
            // 分析阶段: 30-50
            if (progress > 25 && progress <= 50) {
                setStepActive("step-analyze");
            } else if (progress > 50) {
                setStepDone("step-analyze");
            }
            // 渲染阶段: 50-80
            if (progress > 50 && progress <= 80) {
                setStepActive("step-render");
            } else if (progress > 80) {
                setStepDone("step-render");
            }
            // 后处理阶段: 85-100
            if (progress > 80) {
                setStepActive("step-post");
            }
        }

        function startElapsedTimer() {
            _elapsedStart = Date.now();
            const el = document.getElementById("progress-elapsed");
            _elapsedTimer = setInterval(() => {
                const sec = Math.floor((Date.now() - _elapsedStart) / 1000);
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                el.textContent = `已用时 ${m}:${String(s).padStart(2, "0")}`;
            }, 1000);
        }

        function stopElapsedTimer() {
            if (_elapsedTimer) { clearInterval(_elapsedTimer); _elapsedTimer = null; }
        }

        // ===== 提交任务 =====
        async function submitTask() {
            const btn = document.getElementById("submit-btn");
            btn.disabled = true;
            btn.textContent = "处理中...";

            // 立即显示进度区域
            const progressSection = document.getElementById("progress-section");
            const resultSection = document.getElementById("result-section");
            resultSection.classList.remove("active");
            progressSection.classList.add("active");
            resetProgressSteps();
            document.getElementById("progress-fill").style.width = "0%";
            document.getElementById("progress-msg").textContent = "正在提交任务...";
            document.getElementById("progress-elapsed").textContent = "";
            startElapsedTimer();

            try {
                let videoPaths, bgmPath;

                // BGM
                if (bgmMode === "upload") {
                    const bgmFile = document.getElementById("bgm-file").files[0];
                    if (!bgmFile) {
                        shake(document.getElementById("bgm-upload-section"));
                        showToast("请选择 BGM 文件");
                        btn.disabled = false; btn.textContent = "开始混剪";
                        stopElapsedTimer(); return;
                    }
                    bgmPath = await uploadBgm(bgmFile);
                }

                // 视频来源
                if (sourceMode === "upload") {
                    const videoFiles = document.getElementById("video-files").files;
                    if (videoFiles.length === 0) {
                        shake(document.getElementById("upload-section"));
                        showToast("请选择视频文件");
                        btn.disabled = false; btn.textContent = "开始混剪";
                        stopElapsedTimer(); return;
                    }
                    videoPaths = await uploadFiles(videoFiles);
                }

                const style = document.getElementById("style-value").value;
                const stylePreset = document.getElementById("style-preset-value").value;
                const selectedSources = getSelectedSources();

                const formData = new FormData();
                formData.append("video_paths", JSON.stringify(videoPaths || []));
                formData.append("style", style);
                if (stylePreset) formData.append("style_preset", stylePreset);

                // BGM：上传文件或搜索关键词
                if (bgmMode === "upload") {
                    formData.append("bgm_path", bgmPath);
                } else {
                    const bgmQuery = document.getElementById("bgm-query");
                    if (!bgmQuery.value.trim()) {
                        shake(bgmQuery);
                        showToast("请输入 BGM 搜索关键词");
                        btn.disabled = false; btn.textContent = "开始混剪";
                        stopElapsedTimer(); return;
                    }
                    formData.append("bgm_query", bgmQuery.value);
                }

                if (sourceMode === "search") {
                    const query = document.getElementById("search-query");
                    if (!query.value.trim()) {
                        shake(query);
                        showToast("请输入搜索关键词");
                        btn.disabled = false; btn.textContent = "开始混剪";
                        stopElapsedTimer(); return;
                    }
                    if (selectedSources.length === 0) {
                        shake(document.querySelector(".source-toggle"));
                        showToast("请至少选择一个素材来源");
                        btn.disabled = false; btn.textContent = "开始混剪";
                        stopElapsedTimer(); return;
                    }
                    formData.append("query", query.value);
                    formData.append("source", selectedSources[0]);
                    formData.append("clip_limit", document.getElementById("clip-limit").value);
                }

                // 带超时的 fetch（60秒）
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000);
                const resp = await fetch("/api/montage", { method: "POST", body: formData, signal: controller.signal });
                clearTimeout(timeoutId);

                if (!resp.ok) {
                    throw new Error(`服务器返回错误 (${resp.status})`);
                }

                const data = await resp.json();
                if (data.error) {
                    throw new Error(data.error);
                }

                listenProgress(data.task_id);

            } catch (e) {
                stopElapsedTimer();
                if (e.name === "AbortError") {
                    showToast("提交超时，请检查服务器是否正常运行");
                    document.getElementById("progress-msg").textContent = "提交超时，请重试";
                } else {
                    showToast("出错了: " + e.message);
                    document.getElementById("progress-msg").textContent = "出错: " + e.message;
                }
                btn.disabled = false;
                btn.textContent = "开始混剪";
            }
        }

        function listenProgress(taskId) {
            if (_currentEvtSource) { _currentEvtSource.close(); }
            const evtSource = new EventSource(`/api/task/${taskId}/progress`);
            _currentEvtSource = evtSource;

            let retryCount = 0;
            const maxRetries = 3;

            evtSource.onmessage = (e) => {
                retryCount = 0; // 收到消息就重置重试计数
                const data = JSON.parse(e.data);
                const progress = data.progress || 0;
                const message = data.message || "";

                document.getElementById("progress-fill").style.width = progress + "%";
                document.getElementById("progress-msg").textContent = message;
                updateStepsByProgress(progress, message);

                if (data.status === "done") {
                    evtSource.close();
                    _currentEvtSource = null;
                    stopElapsedTimer();
                    setStepDone("step-post");
                    document.getElementById("result-section").classList.add("active");
                    document.getElementById("download-link").href = `/api/download/${taskId}`;
                    document.getElementById("submit-btn").disabled = false;
                    document.getElementById("submit-btn").textContent = "开始混剪";
                    showToast("混剪完成! 🎉");
                } else if (data.status === "error") {
                    evtSource.close();
                    _currentEvtSource = null;
                    stopElapsedTimer();
                    showToast("❌ " + (data.message || "混剪失败"));
                    document.getElementById("submit-btn").disabled = false;
                    document.getElementById("submit-btn").textContent = "开始混剪";
                }
            };

            evtSource.onerror = () => {
                evtSource.close();
                _currentEvtSource = null;
                // SSE 断开时如果还没收到完成/错误状态，提示用户
                stopElapsedTimer();
                const fill = document.getElementById("progress-fill");
                const currentProgress = parseFloat(fill.style.width) || 0;
                if (currentProgress < 100) {
                    showToast("连接中断，请刷新页面重试");
                    document.getElementById("progress-msg").textContent = "⚠️ 进度连接中断";
                    document.getElementById("submit-btn").disabled = false;
                    document.getElementById("submit-btn").textContent = "开始混剪";
                }
            };
        }

        // 初始化
        renderSourceTable();
        loadStylePresets();
    </script>
</body>
</html>
